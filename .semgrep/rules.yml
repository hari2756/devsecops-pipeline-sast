rules:
  - id: sql-injection-user-input
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      SQL injection: user input from request.args flows into the SQL query string.
      Use parameterized queries, e.g. cursor.execute("SELECT * FROM users WHERE name = ?", (username,))
    pattern-sources:
      - pattern: request.args.get(...)
    pattern-sinks:
      - patterns:
          - pattern: $CURSOR.execute($QUERY, ...)
          - focus-metavariable: $QUERY 
 
  - id: hardcoded-password
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded secret in variable $VAR. Load it from an environment variable
      or a secrets manager instead.
    patterns:
      - pattern: $VAR = "..."
      - pattern-not: $VAR = ""
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|passwd|secret|api_key|token).*