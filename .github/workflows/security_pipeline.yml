name: DevSecOps SAST Quality Gate

on: [push, pull_request]

jobs:
  security_scan:
    name: Semgrep Static Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      # Running semgrep with '--error' enforces the Quality Gate.
      # If any vulnerability is found, it exits with an error code and turns the build RED.
      - name: Run Semgrep with Blocking Quality Gate
        run: |
          semgrep scan --config "p/owasp-top-ten" --config "p/secrets" --error