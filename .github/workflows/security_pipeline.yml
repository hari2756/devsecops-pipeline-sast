name: DevSecOps Multi-Tier Security Gate

on: [push, pull_request]

jobs:
  build_test_and_scan:
    name: Unit Tests, SAST, SCA & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Scanners
        run: |
          pip install -r requirements.txt
          pip install semgrep pip-audit

      - name: Run Functional Unit Tests (pytest)
        run: python -m pytest

      - name: Run SAST Scan (Semgrep JSON Report)
        run: |
          semgrep scan --config "p/python" --config "p/flask" --config ".semgrep/rules/" --json --output semgrep_report.json

      - name: Run SCA Dependency Scan (pip-audit JSON Report)
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --format json --output pip_audit_report.json

      - name: Upload Security Scan Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops-security-reports
          path: |
            semgrep_report.json
            pip_audit_report.json

      - name: Evaluate Programmatic Quality Gate
        run: python scripts/quality_gate.py