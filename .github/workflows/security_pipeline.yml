name: Semgrep Scan
 
on:
  push:
    branches: [main]
  pull_request:
 
jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
 
      - name: Run Semgrep
        # --error makes the job fail when findings exist
        run: semgrep scan --config .semgrep/rules.yml --config p/python --error